<style>
/* 게임 목록(사이트 맨 위). 게임마다 폴더 하나: /<게임>/ 소개, /<게임>/privacy/ 처리방침. app-ads.txt는 모든 게임이 같이 쓴다 */
:root { --ink: #24262e; --muted: #6b6f7d; --bg: #f5f6f9; --card: #ffffff; --line: #e1e4ec; --link: #2f6fd6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 24px; }
ul.games { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
ul.games li { display: flex; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
ul.games img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
ul.games h2 { font-size: 1.15rem; margin: 0; }
ul.games h2 a { color: var(--ink); text-decoration: none; }
ul.games p { margin: 2px 0 6px; color: var(--muted); font-size: 0.95rem; }
.links a { color: var(--link); font-size: 0.92rem; }
footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 32px; }
footer a { color: var(--link); }
</style>
